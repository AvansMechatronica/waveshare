; PlatformIO Project Configuration File for Waveshare ESP32-S3-POE-ETH-8DI-8DO
; Hardware: ESP32-S3-WROOM-1U-N16R8 (16MB Flash / 8MB PSRAM), W5500 Ethernet
;
; Template-project: één codebase voor WiFi access-point (AP) en station (STA) mode.
;
;   AP-modus  : het board maakt zelf een WiFi-netwerk en is bereikbaar op wifi_ap_ip.
;   STA-modus : het board verbindt met een bestaand WiFi-netwerk (IP via DHCP).
;
; Kiezen van de modus:
;   - Zet default_envs hieronder op "waveshare_esp32s3_ap" of "waveshare_esp32s3_sta", of
;   - kies het environment in VS Code (PlatformIO statusbalk), of
;   - bouw expliciet:  pio run -e waveshare_esp32s3_sta -t upload
;
; Pas de WiFi-parameters aan in de [env:...] secties hieronder.
; Let op: commit geen echte wachtwoorden naar een publieke repository.

[platformio]
default_envs = waveshare_esp32s3_sta

; ---------------------------------------------------------------------------
; Gemeenschappelijke instellingen voor beide modi
; ---------------------------------------------------------------------------
[env]
platform = espressif32
framework = arduino

; Gebruik het algemene ESP32-S3 development board als basis
board = esp32-s3-devkitc-1

; Seriële monitor & Upload snelheden
monitor_speed = 115200
upload_speed = 921600

; Zorg dat serieële output direct via de ingebouwde USB-C poort loopt (Native CDC)
monitor_filters = esp32_exception_decoder

; Flash & PSRAM Configuraties voor de N16R8 module
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Gebruik de volledige 16MB flash partitietabel (zonder dit crash/bootlused de ESP)
board_build.partitions = default_16MB.csv

; Build flags voor PSRAM activatie en USB opstart-instellingen
common_build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; NimBLE-Arduino is vereist voor BLE: de huidige arduino-esp32 3.x core bouwt alleen
; met de NimBLE-stack en bevat niet langer de klassieke Bluedroid "BLE" bibliotheek (BLEDevice.h)
lib_deps =
    arduino-libraries/Ethernet @ ^2.0.2
    bblanchon/ArduinoJson @ ^7.0.0
    h2zero/NimBLE-Arduino @ ^2.5.2

lib_extra_dirs = ../libraries

; ---------------------------------------------------------------------------
; Access-point modus: het board maakt zelf een WiFi-netwerk
; ---------------------------------------------------------------------------
[env:waveshare_esp32s3_ap]
; Naam en wachtwoord van het netwerk dat het board aanmaakt (wachtwoord min. 8 tekens)
custom_wifi_ssid     = ESP32-S3-POE-ETH-8DI-8DO
custom_wifi_password = waveshare
; IP-adres van het board (tevens gateway), subnetmasker en WiFi-kanaal (1-13)
custom_wifi_ap_ip      = 192,168,4,1
custom_wifi_ap_subnet  = 255,255,255,0
custom_wifi_ap_channel = 1
; Maximaal aantal gelijktijdige clients (1-10)
custom_wifi_ap_max_clients = 4

build_flags =
    ${env.common_build_flags}
    -DAPP_WIFI_MODE_AP=1
    '-DAPP_WIFI_SSID="${this.custom_wifi_ssid}"'
    '-DAPP_WIFI_PASSWORD="${this.custom_wifi_password}"'
    -DAPP_WIFI_AP_IP=${this.custom_wifi_ap_ip}
    -DAPP_WIFI_AP_SUBNET=${this.custom_wifi_ap_subnet}
    -DAPP_WIFI_AP_CHANNEL=${this.custom_wifi_ap_channel}
    -DAPP_WIFI_AP_MAX_CLIENTS=${this.custom_wifi_ap_max_clients}

; ---------------------------------------------------------------------------
; Station modus: het board verbindt met een bestaand WiFi-netwerk
; ---------------------------------------------------------------------------
[env:waveshare_esp32s3_sta]
; Naam en wachtwoord van het bestaande WiFi-netwerk
custom_wifi_ssid     = YourWiFiSSID
custom_wifi_password = YourWiFiPassword
; Hostnaam waarmee het board zich aanmeldt bij de router
custom_wifi_hostname = esp32s3-8di-8do

build_flags =
    ${env.common_build_flags}
    -DAPP_WIFI_MODE_STA=1
    '-DAPP_WIFI_SSID="${this.custom_wifi_ssid}"'
    '-DAPP_WIFI_PASSWORD="${this.custom_wifi_password}"'
    '-DAPP_WIFI_HOSTNAME="${this.custom_wifi_hostname}"'
