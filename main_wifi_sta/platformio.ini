; PlatformIO Project Configuration File for Waveshare ESP32-S3-POE-ETH-8DI-8DO
; Hardware: ESP32-S3-WROOM-1U-N16R8 (16MB Flash / 8MB PSRAM), W5500 Ethernet

[env:waveshare_esp32s3_io]
platform = espressif32
framework = arduino

; Gebruik het algemene ESP32-S3 development board als basis
board = esp32-s3-devkitc-1

; Seriële monitor & Upload snelheden
monitor_speed = 115200
upload_speed = 921600

; Zorg dat serieële output direct via de ingebouwde USB-C poort loopt (Native CDC)
monitor_filters = esp32_exception_decoder

; Flash & PSRAM Configuraties voor de N16R8 module
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Gebruik de volledige 16MB flash partitietabel (zonder dit crash/bootlused de ESP)
board_build.partitions = default_16MB.csv

; Build flags voor PSRAM activatie, USB opstart-instellingen en ethernet definities
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_USB_DFU_ON_BOOT=0

; Veelgebruikte bibliotheken voor dit specifieke board (optioneel)
lib_deps = 
    arduino-libraries/Ethernet @ ^2.0.2
    bblanchon/ArduinoJson @ ^7.0.0

lib_extra_dirs = ../libraries
